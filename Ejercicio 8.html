	<body>
	<p align="left">"Sí, repite la hormiga,</p>
	<p align="left">he visto las estrellas</p>
	<p align="left">subi al árbol más alto</p>
	<p align="left">que tiene alameda</p>
	<p align="left">y vi miles de ojos</p>
	<p align="left">dentro de mis tinieblas."</p>
	<p>Extractos del poema <b><cite>Los encuentros de un caracol aventurero</cite></b>, de Federico García Lorca.</p>
